    <script>
        function validateSpellSelection() {
            const selects = document.querySelectorAll('select');
            const defaultText = 'Choose A Spell';
            const allSelected = Array.from(selects).every((select) => {
                return select.value && select.options[select.selectedIndex].text !== defaultText;
            });

            const finalizeButton = document.getElementById('finalize-button');
            const downloadButton = document.getElementById('download-button');

            if (allSelected === true) {
                finalizeButton.disabled = false;
                finalizeButton.classList.remove('disabled-button');

                downloadButton.disabled = false;
                downloadButton.classList.remove('disabled-button');
            } else {
                finalizeButton.disabled = true;
                finalizeButton.classList.add('disabled-button');

                downloadButton.disabled = true;
                downloadButton.classList.add('disabled-button');
            }

            return allSelected;
        }

        document.querySelectorAll('select').forEach((select) => {
            select.addEventListener('change', validateSpellSelection);
        });

        function setRandomSpells() {
            const selects = document.querySelectorAll('select');

            selects.forEach((select) => {
                if (select.options.length <= 1) {
                    return;
                }

                const randomIndex = Math.floor(Math.random() * (select.options.length - 1)) + 1;
                select.selectedIndex = randomIndex;
            });

            validateSpellSelection();
        }

        document.getElementById('random-button').addEventListener('click', setRandomSpells);

        document.getElementById('upload-button').addEventListener('click', function() {
            const jsonInput = document.getElementById('upload-json-input');
            jsonInput.value = '';
            jsonInput.click();
        });

        document.getElementById('upload-json-input').addEventListener('change', function(event) {
            const file = event.target.files[0];

            if (!file) {
                return;
            }

            const isJsonMime = file.type === 'application/json';
            const isJsonExt = file.name.toLowerCase().endsWith('.json');

            if (!isJsonMime && !isJsonExt) {
                alert('Incorrect file format or data. Please upload a json file created by this application.');
                event.target.value = '';
                return;
            }

            const reader = new FileReader();

            reader.onload = function(loadEvent) {
                try {
                    const parsed = JSON.parse(loadEvent.target.result);
                    const selects = Array.from(document.querySelectorAll('select'));
                    const isObject = parsed && typeof parsed === 'object' && !Array.isArray(parsed);
                    const hasValidTimestamp = typeof parsed.exportedAt === 'string';
                    const hasSpellArray = Array.isArray(parsed.spells);

                    if (!isObject || !hasValidTimestamp || !hasSpellArray) {
                        throw new Error('Invalid file structure');
                    }

                    if (parsed.spells.length !== selects.length) {
                        throw new Error('Spell count does not match');
                    }

                    const selectMap = new Map(selects.map((select) => [select.id, select]));

                    parsed.spells.forEach((spellData) => {
                        const hasExpectedShape = spellData
                            && typeof spellData === 'object'
                            && typeof spellData.id === 'string'
                            && typeof spellData.value === 'string'
                            && typeof spellData.text === 'string';

                        if (!hasExpectedShape) {
                            throw new Error('Invalid spell entry');
                        }

                        const select = selectMap.get(spellData.id);

                        if (!select) {
                            throw new Error('Unknown dropdown id');
                        }

                        const matchingOption = Array.from(select.options).find((option) => {
                            return option.value === spellData.value && option.text === spellData.text;
                        });

                        if (!matchingOption) {
                            throw new Error('Selection not available in dropdown');
                        }
                    });

                    parsed.spells.forEach((spellData) => {
                        const select = selectMap.get(spellData.id);
                        select.value = spellData.value;
                    });

                    validateSpellSelection();
                } catch (error) {
                    alert('Incorrect file format or data. Please upload a json file created by this application.');
                } finally {
                    event.target.value = '';
                }
            };

            reader.onerror = function() {
                alert('Incorrect file format or data. Please upload a json file created by this application.');
                event.target.value = '';
            };

            reader.readAsText(file);
        });

        document.getElementById('download-button').addEventListener('click', function() {
            const selections = Array.from(document.querySelectorAll('select')).map((select) => {
                return {
                    id: select.id,
                    value: select.value,
                    text: select.options[select.selectedIndex].text
                };
            });

            const payload = {
                exportedAt: new Date().toISOString(),
                spells: selections
            };

            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');

            link.href = url;
            link.download = 'spell-selections.json';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });
    </script>
